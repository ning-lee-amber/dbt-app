<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBT 技巧 APP 介面草稿</title>
<style>
:root{
  --bg:#eef0ee; --phone:#fafaf8; --card:#ffffff; --ink:#2b2f2c; --muted:#7a817c;
  --line:#e3e6e3; --accent:#5f7f72; --accent-soft:#e3ece7; --warn:#b5574b;
  --dark:#1d2321; --dark-card:#2a312e; --dark-ink:#e8ece9; --dark-muted:#9aa49f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151918; --phone:#1d2120; --card:#262b29; --ink:#e6eae7; --muted:#949c97;
    --line:#333a37; --accent:#8fb3a3; --accent-soft:#2c3a34;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
header.page{max-width:1200px;margin:0 auto;padding:28px 16px 8px}
header.page h1{font-size:22px;margin:0 0 6px;font-weight:600}
header.page p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
h2.section{max-width:1200px;margin:24px auto 0;padding:0 16px;font-size:16px;font-weight:600}
.grid{max-width:1200px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
figure{margin:0;width:340px;max-width:100%}
figcaption{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}
figcaption b{color:var(--ink);font-weight:600}
.phone{width:340px;max-width:100%;height:700px;border-radius:36px;background:var(--phone);
  border:8px solid #2b2f2c;overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone.dark{background:var(--dark);color:var(--dark-ink)}
.screen{flex:1;overflow-y:auto;padding:18px 16px 16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h2{font-size:20px;margin:0;font-weight:600}
.top small{color:var(--muted);font-size:12px;display:block}
.sos{border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:20px;
  padding:6px 12px;font-size:13px;font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.dark .card{background:var(--dark-card);border-color:#3a4340}
.card h3{font-size:14px;margin:0 0 10px;font-weight:600}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;
  padding:6px 11px;font-size:12px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
label.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:7px 0;
  border-bottom:1px solid var(--line);line-height:1.45;cursor:pointer}
label.check:last-child{border-bottom:none}
label.check input{accent-color:var(--accent);width:17px;height:17px;margin:1px 0 0;flex:none}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;
  font-family:inherit;font-size:13px;background:transparent;color:inherit;resize:none}
.field-label{font-size:12px;color:var(--muted);margin:10px 0 5px}
.quote{text-align:center;font-size:15px;line-height:1.7;padding:18px 10px;color:var(--accent)}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--phone)}
.tabs span{flex:1;text-align:center;font-size:11px;padding:10px 0 14px;color:var(--muted)}
.tabs span.on{color:var(--accent);font-weight:600}
.tabs span i{display:block;width:6px;height:6px;border-radius:3px;margin:0 auto 5px;background:currentColor;opacity:.5}
.big-btn{display:block;width:100%;text-align:left;border:none;border-radius:18px;padding:20px 18px;
  margin-bottom:14px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;
  background:var(--dark-card);color:var(--dark-ink)}
.big-btn small{display:block;font-weight:400;font-size:12px;color:var(--dark-muted);margin-top:6px}
.center{text-align:center}
.octagon{width:150px;height:150px;margin:20px auto 18px;background:#a8473c;color:#fff;
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;transition:background .4s}
.steps{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.steps b{width:28px;height:28px;border-radius:14px;border:1px solid #4a5450;display:flex;
  align-items:center;justify-content:center;font-size:12px;color:var(--dark-muted)}
.steps b.on{background:var(--dark-ink);color:var(--dark);border-color:var(--dark-ink)}
.step-title{font-size:22px;font-weight:600;margin:0 0 8px}
.step-text{font-size:14px;color:var(--dark-muted);line-height:1.7;min-height:48px;margin:0 8px}
.pill-btn{border:none;border-radius:24px;padding:12px 26px;font-family:inherit;font-size:15px;
  background:var(--dark-ink);color:var(--dark);margin-top:22px;cursor:pointer}
.tag{font-size:10px;border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--muted);margin-left:6px;white-space:nowrap}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.pc div{background:var(--bg);border-radius:10px;padding:9px;line-height:1.6}
.pc h4{margin:0 0 4px;font-size:12px}
.ask{font-size:16px;font-weight:600;text-align:center;line-height:1.6;margin:16px 4px}
.primary{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-family:inherit;
  font-size:15px;background:var(--accent);color:#fff;cursor:pointer}
.rating{display:flex;gap:6px;margin-top:6px}
.rating button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;
  padding:9px 0;font-family:inherit;font-size:14px;cursor:pointer}
.rating button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.anchor{font-size:12px;color:var(--accent);margin-top:7px;min-height:18px}
.sense{font-size:12px;color:var(--muted);margin:12px 0 2px;font-weight:600}
.progress{display:flex;gap:4px;margin-bottom:14px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)}
.yn{display:flex;gap:6px;margin-top:6px}
.yn button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;
  padding:8px 0;font-family:inherit;font-size:13px;cursor:pointer}
.yn button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.result{font-size:13px;line-height:1.6;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:11px 12px;margin-top:4px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;background:var(--bg);border-radius:10px;padding:9px 10px;margin-top:8px}
.compare{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 8px}
.compare b{font-size:34px;font-weight:600}
.compare span{color:var(--muted);font-size:20px}
.compare small{display:block;font-size:11px;color:var(--muted);text-align:center;font-weight:400}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:none}
summary{list-style:none;cursor:pointer;padding:12px 0;font-size:14px;font-weight:600;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary span{font-weight:400;color:var(--muted);font-size:12px}
details ol{list-style:none;margin:0 0 10px;padding:0}
details li{font-size:13px;padding:6px 0;display:flex;gap:8px;line-height:1.4}
details li em{font-style:normal;color:var(--muted);font-size:11px;min-width:30px;padding-top:1px}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:13px;background:var(--card);color:var(--ink);margin-bottom:12px}
.src{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5}
.kp{margin:0;padding-left:18px;font-size:13px;line-height:1.75}
</style>
</head>
<body>
<header class="page">
  <h1>DBT 技巧 APP｜介面草稿</h1>
  <p>安靜簡潔風格。勾選、滑桿、評分和按鈕都可以點按試用；文字是示意，資料不會儲存。</p>
</header>

<h2 class="section">第一階段：每天和危機時</h2>
<div class="grid">

<!-- 今天 -->
<figure>
<div class="phone">
  <div class="screen">
    <div class="top">
      <div><small>11 月 18 日 星期三</small><h2>今天</h2></div>
      <button class="sos">撐不住了</button>
    </div>
    <div class="card">
      <div class="row"><h3 style="margin:0">早上的心情</h3><span id="moodV">40</span></div>
      <input type="range" min="0" max="100" value="40" oninput="moodV.textContent=this.value">
      <div class="row" style="color:var(--muted);font-size:11px"><span>很糟 0</span><span>100 很好</span></div>
    </div>
    <div class="card">
      <h3>照顧身體（PLEASE）</h3>
      <div class="chips">
        <button class="chip on">睡 7 小時</button><button class="chip">運動</button>
        <button class="chip on">三餐正常</button><button class="chip">沒喝酒</button>
        <button class="chip">身體不適已處理</button>
      </div>
    </div>
    <div class="card">
      <h3>今天的一件好事</h3>
      <label class="check"><input type="checkbox">傍晚出去散步十分鐘</label>
    </div>
    <div class="card"><div class="quote">情緒會來，也會走。<br>你不等於你的情緒。</div></div>
  </div>
  <div class="tabs"><span class="on"><i></i>今天</span><span><i></i>記錄</span><span><i></i>工具</span><span><i></i>講義</span><span><i></i>我的</span></div>
</div>
<figcaption><b>① 今天</b>　右上角「撐不住了」每一頁都看得到。底部第四格改成「講義」。</figcaption>
</figure>

<!-- 危機入口 -->
<figure>
<div class="phone dark">
  <div class="screen">
    <p style="font-size:13px;color:var(--dark-muted);margin:8px 0 4px">危機模式</p>
    <p style="font-size:22px;font-weight:600;margin:0 0 26px;line-height:1.5">先吸一口氣。<br>你現在比較像哪一種？</p>
    <button class="big-btn">我快要做出衝動的事<small>先停下來 → 看你的衝動卡</small></button>
    <button class="big-btn">情緒太強烈，撐不住<small>先讓身體降溫 → 冷水、運動、放鬆</small></button>
    <button class="big-btn" style="font-size:15px">只想先轉移注意力<small>打開我的五感清單</small></button>
  </div>
</div>
<figcaption><b>② 危機模式入口</b>　深色、大按鈕、選項少。</figcaption>
</figure>

<!-- STOP -->
<figure>
<div class="phone dark">
  <div class="screen center">
    <p style="font-size:13px;color:var(--dark-muted);margin:8px 0 0">STOP 立即停止</p>
    <div class="octagon" id="stopIcon">S</div>
    <div class="steps" id="stopDots"><b class="on">S</b><b>T</b><b>O</b><b>P</b></div>
    <p class="step-title" id="stopTitle">停下來</p>
    <p class="step-text" id="stopText">先不要動，連手指都不要動。<br>情緒想讓你立刻反應。</p>
    <button class="pill-btn" id="stopBtn" onclick="nextStop()">下一步</button>
  </div>
</div>
<figcaption><b>③ STOP</b>　按「下一步」看四個步驟。</figcaption>
</figure>

<!-- 衝動卡 -->
<figure>
<div class="phone">
  <div class="screen">
    <div class="top"><div><small>我的衝動卡</small><h2>想喝酒的時候</h2></div></div>
    <div class="card">
      <div class="pc">
        <div><h4>順著衝動</h4>好處：馬上放鬆<span class="tag">當天</span><br>壞處：隔天更沮喪<span class="tag">長期</span></div>
        <div><h4>抗拒衝動</h4>好處：守住戒酒天數<span class="tag">長期</span><br>壞處：現在很難受<span class="tag">當天</span></div>
      </div>
    </div>
    <div class="card">
      <h3>這時候我可以做的</h3>
      <label class="check"><input type="checkbox">冷水洗臉 30 秒</label>
      <label class="check"><input type="checkbox">打給小安</label>
      <label class="check"><input type="checkbox">出門走一圈</label>
    </div>
    <p class="ask">你要的是愉快的一天，<br>還是愉快的人生？</p>
    <button class="primary">再撐五分鐘</button>
  </div>
</div>
<figcaption><b>④ 衝動卡</b>　平常先寫好，危機時直接打開。</figcaption>
</figure>

<!-- 危機紀錄 -->
<figure>
<div class="phone">
  <div class="screen">
    <div class="top"><div><small>危機過後再填</small><h2>危機紀錄</h2></div></div>
    <div class="card">
      <div class="field-label" style="margin-top:0">發生了什麼？（人、事、時、地）</div>
      <textarea rows="2">晚上和家人吵架後</textarea>
      <div class="row field-label"><span>痛苦程度：使用技巧前</span><b id="preV" style="color:var(--ink)">85</b></div>
      <input type="range" min="0" max="100" value="85" oninput="preV.textContent=this.value">
    </div>
    <div class="card">
      <h3>用了哪些技巧</h3>
      <label class="check"><input type="checkbox" checked>STOP 立即停止</label>
      <label class="check"><input type="checkbox">優缺點分析</label>
      <label class="check"><input type="checkbox" checked>TIP 讓身體降溫</label>
      <label class="check"><input type="checkbox">轉移注意力（ACCEPTS）</label>
      <label class="check"><input type="checkbox">五感自我撫慰</label>
      <label class="check"><input type="checkbox">改善當下（IMPROVE）</label>
    </div>
    <div class="card">
      <div class="row field-label" style="margin-top:0"><span>痛苦程度：使用技巧後</span><b id="postV" style="color:var(--ink)">50</b></div>
      <input type="range" min="0" max="100" value="50" oninput="postV.textContent=this.value">
      <div class="field-label">技巧幫你撐住了多少？</div>
      <div class="rating" id="rating"><button>1</button><button>2</button><button class="on">3</button><button>4</button><button>5</button></div>
      <div class="anchor" id="anchor">有些幫助，多少能應付當下</div>
    </div>
  </div>
</div>
<figcaption><b>⑤ 危機紀錄</b>　作業單有勾選就做勾選，要填寫就做輸入框。</figcaption>
</figure>

<!-- 工具箱 -->
<figure>
<div class="phone">
  <div class="screen">
    <div class="top"><div><small>平常先準備好</small><h2>我的工具箱</h2></div></div>
    <div class="card">
      <h3>五感自我撫慰</h3>
      <div class="sense">視覺</div>
      <label class="check"><input type="checkbox" checked>看窗外的天空</label>
      <label class="check"><input type="checkbox">點一盞蠟燭</label>
      <div class="sense">聽覺</div>
      <label class="check"><input type="checkbox" checked>聽那首固定的歌</label>
      <div class="sense">嗅覺・味覺・觸覺</div>
      <label class="check"><input type="checkbox" checked>泡一杯熱可可</label>
      <label class="check"><input type="checkbox">用毯子包住自己</label>
      <div style="margin-top:8px"><input type="text" placeholder="＋ 新增我自己的方法"></div>
    </div>
    <div class="card">
      <h3>對自己說的話</h3>
      <p>「這件事也會過去。」<br>「我已經盡力了。」</p>
    </div>
  </div>
  <div class="tabs"><span><i></i>今天</span><span><i></i>記錄</span><span><i></i>工具</span><span><i></i>講義</span><span class="on"><i></i>我的</span></div>
</div>
<figcaption><b>⑥ 我的工具箱</b>　危機模式只顯示你挑過的項目。</figcaption>
</figure>
</div>

<h2 class="section">相反行動（三步驟）</h2>
<div class="grid">

<!-- 相反行動 1 -->
<figure>
<div class="phone">
  <div class="screen">
    <div class="progress"><i class="on"></i><i></i><i></i></div>
    <div class="top"><div><small>相反行動 1/3</small><h2>先確認情緒</h2></div></div>
    <div class="card">
      <h3>這是什麼情緒？</h3>
      <div class="chips" id="emoChips"></div>
      <div class="row field-label"><span>強度（0–100）</span><b id="oaPreV" style="color:var(--ink)">80</b></div>
      <input type="range" min="0" max="100" value="80" id="oaPre" oninput="oaPreV.textContent=this.value;oaPreShow.textContent=this.value">
      <div class="field-label">發生了什麼？（人、事、時、地）</div>
      <textarea rows="2" placeholder="例如：週末一整天都沒人約我"></textarea>
    </div>
    <div class="card">
      <h3>這個情緒符合事實嗎？</h3>
      <div class="yn" data-q="fact"><button data-v="1">符合</button><button data-v="0">不符合</button></div>
      <h3 style="margin-top:14px">跟著情緒去做，對我有幫助嗎？</h3>
      <div class="yn" data-q="eff"><button data-v="1">有幫助</button><button data-v="0">沒幫助</button></div>
      <div class="result" id="oaResult" style="margin-top:12px">回答上面兩題，看看適不適合用相反行動。</div>
      <div class="hint">不確定符不符合事實？→ 先去「核對事實」</div>
    </div>
  </div>
</div>
<figcaption><b>⑦ 先確認</b>　選情緒、評強度，再用兩題判斷該不該做相反行動。試著點不同情緒，下一頁的內容會跟著換。</figcaption>
</figure>

<!-- 相反行動 2 -->
<figure>
<div class="phone">
  <div class="screen">
    <div class="progress"><i class="on"></i><i class="on"></i><i></i></div>
    <div class="top"><div><small>相反行動 2/3</small><h2 id="oaTitle">悲傷的相反行動</h2></div></div>
    <div class="card">
      <h3>我現在想做的（行動衝動）</h3>
      <div id="oaUrges"></div>
    </div>
    <div class="card">
      <h3>相反的做法</h3>
      <div id="oaOpp"></div>
    </div>
    <div class="card">
      <h3>身體也一起做相反</h3>
      <div id="oaBody"></div>
      <div id="oaHint"></div>
    </div>
    <div class="card">
      <h3>我具體要做的事</h3>
      <input type="text" placeholder="例如：打給阿明約明天吃午餐">
    </div>
  </div>
</div>
<figcaption><b>⑧ 找出相反做法</b>　依第一頁選的情緒，列出常見衝動和相反做法，全部可以勾選，再寫下自己要做的事。要「完全」相反，連姿勢和表情都一起改。</figcaption>
</figure>

<!-- 相反行動 3 -->
<figure>
<div class="phone">
  <div class="screen">
    <div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <div class="top"><div><small>相反行動 3/3</small><h2>做完之後</h2></div></div>
    <div class="card">
      <div class="field-label" style="margin-top:0">我做了什麼？</div>
      <textarea rows="2" placeholder="仔細寫下來"></textarea>
      <div class="field-label">我怎麼做的？（表情、姿勢、語調、想法）</div>
      <textarea rows="2"></textarea>
    </div>
    <div class="card">
      <h3>現在的強度</h3>
      <input type="range" min="0" max="100" value="45" oninput="oaPostShow.textContent=this.value">
      <div class="compare">
        <b id="oaPreShow">80</b><span>→</span><b id="oaPostShow" style="color:var(--accent)">45</b>
      </div>
      <div class="row" style="justify-content:space-around;font-size:11px;color:var(--muted)"><span>做之前</span><span>做之後</span></div>
    </div>
    <div class="card">

  stopBtn.textContent = stopI===3 ? "看我的衝動卡" : "下一步";

// chips toggle (PLEASE)
document.querySelectorAll(".card .chips:not(#emoChips) .chip").forEach(c=>c.addEventListener("click",()=>c.classList.toggle("on")));

  "憤怒":{u:["想罵人或攻擊","想摔東西","想報復"],o:["溫和地暫時離開","先暫停，慢慢呼吸","對對方客氣一點","試著從對方的角度想"],b:calmBody},
  "厭惡":{u:["想推開、轉頭不看","想一直清洗","看不起對方"],o:["靠近一點，試著接觸或接納","善待自己看不起的人","替對方想一個合理的原因"],b:calmBody},
  "妒羨":{u:["想破壞別人擁有的","想說對方壞話","一直和別人比較"],o:["不去破壞別人的東西","數一數自己擁有的","不誇大自己缺少的"],b:calmBody},
